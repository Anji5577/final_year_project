<!-- templates/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EuroSAT Predictor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 40px; background:#f8f9fa; }
    .card { max-width:720px; margin: auto; }
  </style>
</head>
<body>
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="card-title">EuroSAT Image Predictor (MLX)</h3>
      <p class="card-text">Upload a satellite image (RGB) and the model will predict the land-use class.</p>
      <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <input class="form-control" type="file" name="file" accept="image/*" required>
        </div>
        <button class="btn btn-primary" type="submit">Predict</button>
      </form>
      <hr />
      <small class="text-muted">Model: SimpleCNN trained on EuroSAT. Runs locally.</small>
    </div>
  </div>
</body>
</html>
