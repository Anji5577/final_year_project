<!-- templates/result.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prediction Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style> body { padding-top:40px; background:#f8f9fa } .card { max-width:720px; margin:auto } </style>
</head>
<body>
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <h3>Prediction</h3>
      <p><strong>Class:</strong> {{ predicted }}</p>
      <p><strong>Confidence:</strong> {{ confidence }}%</p>
      <img src="/{{ url_for('static', filename='../uploads/' ~ filename) }}" alt="uploaded" style="max-width:100%;height:auto;border:1px solid #ddd;padding:6px;">
      <hr/>
      <a class="btn btn-secondary" href="{{ url_for('index') }}">Try another image</a>
    </div>
  </div>
</body>
</html>
